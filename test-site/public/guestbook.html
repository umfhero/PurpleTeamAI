<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VulnTest Corp — Guestbook</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: monospace;
            background: #0a0a0a;
            color: #e0e0e0;
            padding: 2rem;
        }

        h1 {
            color: #c084fc;
            margin-bottom: 1rem;
        }

        a {
            color: #93c5fd;
        }

        form {
            margin: 1rem 0;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            max-width: 400px;
        }

        input,
        textarea {
            background: #1a1a1a;
            color: #e0e0e0;
            border: 1px solid #444;
            padding: 0.5rem;
            font-family: monospace;
        }

        textarea {
            min-height: 80px;
            resize: vertical;
        }

        button {
            background: #7c3aed;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            cursor: pointer;
            font-family: monospace;
        }

        button:hover {
            background: #6d28d9;
        }

        .entries {
            margin-top: 2rem;
        }

        .entry {
            border: 1px solid #333;
            padding: 1rem;
            margin: 0.5rem 0;
        }

        .entry .meta {
            color: #888;
            font-size: 0.8rem;
        }
    </style>
</head>

<body>
    <h1>Guestbook</h1>
    <p><a href="/">← Back to Home</a></p>

    <!-- VULNERABLE: No CSRF token, no input sanitization -->
    <form action="/guestbook" method="POST">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Your name" />

        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="Leave a message..."></textarea>

        <button type="submit">Post Message</button>
    </form>

    <div class="entries" id="entries">
        <h2>Recent Messages</h2>
        <p id="loading" style="color: #666;">Loading messages...</p>
    </div>

    <script>
        // Fetches guestbook entries and renders them WITHOUT sanitization (Stored XSS)
        fetch('/api/guestbook')
            .then(r => r.json())
            .then(entries => {
                document.getElementById('loading').remove();
                const container = document.getElementById('entries');
                if (entries.length === 0) {
                    container.innerHTML += '<p style="color: #666;">No messages yet.</p>';
                    return;
                }
                entries.forEach(e => {
                    // VULNERABLE: innerHTML with unsanitized user data
                    const div = document.createElement('div');
                    div.className = 'entry';
                    div.innerHTML = `
            <div class="meta">${e.date} — <strong>${e.name}</strong></div>
            <p>${e.message}</p>
          `;
                    container.appendChild(div);
                });
            });
    </script>
</body>

</html>
