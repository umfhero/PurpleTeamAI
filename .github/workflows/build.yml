name: Build PurpleTeam Suite

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- Set up Node.js ---
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # --- Install dependencies ---
      - name: Install dependencies
        working-directory: frontend
        run: npm install

      # --- Create empty .env (no key bundled in releases) ---
      - name: Create .env file
        run: |
          "GEMINI_API_KEY=" | Out-File -FilePath frontend/.env -Encoding ascii

      # --- Build the Electron app ---
      - name: Build (windows)
        working-directory: frontend
        run: npm run build:win
        env:
          # Suppress native module rebuild warnings on CI
          ELECTRON_BUILDER_SKIP_UNPACK_AND_NOTARIZE: true
          # GitHub token for electron-builder auto-update publish (optional)
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- Upload build artifacts ---
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PurpleTeam-Suite-windows
          path: frontend/release/*.exe
          if-no-files-found: warn

  # --- Create a GitHub Release and attach all artifacts ---
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
