name: Build PurpleTeam Suite

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
            artifact_name: windows
            artifact_pattern: frontend/release/*.exe
          - os: macos-latest
            script: build:mac
            artifact_name: macos
            artifact_pattern: frontend/release/*.dmg
          - os: ubuntu-latest
            script: build:linux
            artifact_name: linux
            artifact_pattern: frontend/release/*.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- Set up Node.js ---
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # --- Install dependencies ---
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # --- Create .env from GitHub Secrets ---
      # The app bundles ../.env as an extraResource, so we recreate it here
      - name: Create .env file
        shell: bash
        run: |
          cat <<EOF > .env
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          EOF

      # --- Linux: install required native libs for Electron ---
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libnotify-dev \
            libnss3 \
            libxss1 \
            libasound2 \
            libxtst6 \
            xvfb \
            rpm

      # --- Build the Electron app ---
      - name: Build (${{ matrix.artifact_name }})
        working-directory: frontend
        run: npm run ${{ matrix.script }}
        env:
          # Suppress native module rebuild warnings on CI
          ELECTRON_BUILDER_SKIP_UNPACK_AND_NOTARIZE: true
          # GitHub token for electron-builder auto-update publish (optional)
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- Upload build artifacts ---
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PurpleTeam-Suite-${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_pattern }}
          if-no-files-found: warn

  # --- Create a GitHub Release and attach all artifacts ---
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
