version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: purpleteamai-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: purpleteamai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: purpleteamai-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
